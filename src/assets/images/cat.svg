<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 고양이 몸통 -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#ff8c42" stroke="#e07b2e" stroke-width="2"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="80" r="40" fill="#ff8c42" stroke="#e07b2e" stroke-width="2"/>

  <!-- 고양이 귀 -->
  <path d="M70 60 L85 40 L95 65 Z" fill="#ff8c42" stroke="#e07b2e" stroke-width="2"/>
  <path d="M105 65 L115 40 L130 60 Z" fill="#ff8c42" stroke="#e07b2e" stroke-width="2"/>

  <!-- 귀 안쪽 -->
  <path d="M75 58 L82 48 L88 62 Z" fill="#ffb380"/>
  <path d="M112 62 L118 48 L125 58 Z" fill="#ffb380"/>

  <!-- 고양이 눈 -->
  <ellipse cx="88" cy="75" rx="8" ry="12" fill="#2c3e50"/>
  <ellipse cx="112" cy="75" rx="8" ry="12" fill="#2c3e50"/>

  <!-- 눈 반사광 -->
  <ellipse cx="90" cy="72" rx="3" ry="4" fill="#ecf0f1"/>
  <ellipse cx="114" cy="72" rx="3" ry="4" fill="#ecf0f1"/>

  <!-- 고양이 코 -->
  <path d="M100 85 L95 92 L105 92 Z" fill="#e74c3c"/>

  <!-- 고양이 입 -->
  <path d="M100 93 Q90 100 85 105" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <path d="M100 93 Q110 100 115 105" stroke="#2c3e50" stroke-width="2" fill="none"/>

  <!-- 고양이 수염 -->
  <line x1="60" y1="80" x2="80" y2="85" stroke="#2c3e50" stroke-width="2"/>
  <line x1="60" y1="90" x2="80" y2="90" stroke="#2c3e50" stroke-width="2"/>
  <line x1="120" y1="85" x2="140" y2="80" stroke="#2c3e50" stroke-width="2"/>
  <line x1="120" y1="90" x2="140" y2="90" stroke="#2c3e50" stroke-width="2"/>

  <!-- 고양이 꼬리 -->
  <path d="M145 130 Q170 110 180 140 Q175 160 160 150 Q150 140 145 130"
        fill="#ff8c42" stroke="#e07b2e" stroke-width="2"/>

  <!-- 고양이 발 -->
  <ellipse cx="75" cy="160" rx="12" ry="8" fill="#e07b2e"/>
  <ellipse cx="125" cy="160" rx="12" ry="8" fill="#e07b2e"/>

  <!-- 고양이 앞발 -->
  <ellipse cx="80" cy="145" rx="8" ry="15" fill="#ff8c42" stroke="#e07b2e" stroke-width="1"/>
  <ellipse cx="120" cy="145" rx="8" ry="15" fill="#ff8c42" stroke="#e07b2e" stroke-width="1"/>

  <!-- 배 무늬 -->
  <ellipse cx="100" cy="125" rx="15" ry="20" fill="#ffb380"/>
</svg>